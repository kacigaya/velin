name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag must match the app version: v0.1.0 or a pre-release such as v0.1.0-alpha.
      - name: Check tag against versionName
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          case "$TAG" in
            "v$version"|"v$version"-*) echo "Releasing $TAG (versionName $version)" ;;
            *) echo "Tag $TAG does not match versionName $version" >&2; exit 1 ;;
          esac

      - name: Set up build
        uses: ./.github/actions/setup-build

      - name: Test
        run: ./gradlew testDebugUnitTest :core:domain:test :core:html:test --console=plain

      # The keystore exists only in the runner's temp dir for this job.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VELIN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Missing secret VELIN_KEYSTORE_BASE64" >&2; exit 1; fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/velin-release.jks"
          echo "VELIN_KEYSTORE_PATH=$RUNNER_TEMP/velin-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          VELIN_KEYSTORE_PASSWORD: ${{ secrets.VELIN_KEYSTORE_PASSWORD }}
          VELIN_KEY_ALIAS: ${{ secrets.VELIN_KEY_ALIAS }}
          VELIN_KEY_PASSWORD: ${{ secrets.VELIN_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Verify signature and prepare assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/velin-$TAG.apk"
          (cd dist && sha256sum "velin-$TAG.apk" > SHA256SUMS)
          rm -f "$RUNNER_TEMP/velin-release.jks"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          notes="docs/releases/$TAG.md"
          if [ -f "$notes" ]; then notes_arg=(--notes-file "$notes"); else notes_arg=(--generate-notes); fi
          gh release create "$TAG" dist/* --title "Velin $TAG" --verify-tag $prerelease "${notes_arg[@]}"
