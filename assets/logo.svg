<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="100%" height="100%">
  <title>Velin</title>
  <!-- An envelope whose flap is a sheet folded into a V: Velin comes from vellum, letter paper. -->
  <defs>
    <clipPath id="envelope">
      <rect x="21" y="31" width="66" height="46" rx="8" />
    </clipPath>
    <filter id="flap-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#142F60" flood-opacity="0.32" />
    </filter>
  </defs>
  <circle cx="54" cy="54" r="54" fill="#2E4578" />
  <rect x="21" y="31" width="66" height="46" rx="8" fill="#D9E2FF" />
  <g clip-path="url(#envelope)">
    <path d="M21,77 L54,51 M87,77 L54,51" stroke="#AFC6FF" stroke-width="2.5" stroke-linecap="round" />
    <g filter="url(#flap-shadow)">
      <path d="M20,31 L54,31 L54,62.5 C52.2,62.5 50.8,61.8 49.6,60.6 L20,31 Z" fill="#5A72A8" />
      <path d="M88,31 L53.7,31 L53.7,62.5 C55.6,62.5 57.1,61.8 58.4,60.6 L88,31 Z" fill="#465D91" />
    </g>
  </g>
</svg>
